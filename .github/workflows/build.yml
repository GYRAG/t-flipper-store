name: Build Flipper ESP32 Variants

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.board.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        board:
          - name: generic_esp32s3
            script_key: esp32s3
            build_dir: build_s3
            artifact_name: flipper-esp32s3-generic
            chip: esp32s3
            flash_size: 16MB
          - name: lilygo_t_embed_cc1101
            script_key: t_embed
            build_dir: build_t_embed
            artifact_name: flipper-lilygo-t-embed-cc1101
            chip: esp32s3
            flash_size: 16MB

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Clean stale sdkconfig
        run: |
          rm -f sdkconfig
          rm -f ${{ matrix.board.build_dir }}/sdkconfig

      - name: Install ESP-IDF system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget flex bison gperf python3 python3-pip python3-venv \
            cmake ninja-build ccache libffi-dev libssl-dev dfu-util \
            libusb-1.0-0 libglib2.0-dev

      - name: Cache ESP-IDF
        uses: actions/cache@v6
        id: idf-cache
        with:
          path: ~/esp/esp-idf
          key: esp-idf-v5.4.1
          restore-keys: esp-idf-v5.4.1

      - name: Clone ESP-IDF v5.4.1
        if: steps.idf-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/esp
          git clone --branch v5.4.1 --depth 1 \
            https://github.com/espressif/esp-idf.git ~/esp/esp-idf

      - name: Cache ESP-IDF tools
        uses: actions/cache@v6
        id: idf-tools-cache
        with:
          path: ~/.espressif
          key: esp-idf-tools-v5.4.1

      - name: Install ESP-IDF tools
        if: steps.idf-tools-cache.outputs.cache-hit != 'true'
        run: |
          ~/esp/esp-idf/install.sh all

      - name: Verify ESP-IDF environment
        run: |
          source ~/esp/esp-idf/export.sh
          echo "IDF_PATH=$IDF_PATH"
          idf.py --version

      - name: Build
        run: |
          source ~/esp/esp-idf/export.sh
          bash ./build.sh --board ${{ matrix.board.script_key }} --build-only

      # ── App store: build the curated FAPs and regenerate the catalog ──────
      # t_embed only: buildFap.sh's TARGETS list has just lilygo_t_embed_cc1101
      # uncommented, and the store serves Xtensa binaries. Runs after Build
      # because buildFap.sh needs build_t_embed/config to exist.
      - name: Build store FAPs + catalog
        if: matrix.board.script_key == 't_embed'
        run: |
          source ~/esp/esp-idf/export.sh
          # tools/fam/compile_icons.py imports PIL at module level; without
          # Pillow every FAP silently loses its icon and fap_manifest.py fails.
          # Install via `python3 -m pip` specifically: buildFap.sh defaults to
          # PYTHON=python3, so Pillow must land in THAT interpreter.
          python3 -m pip install --quiet pillow

          # The stock/modified tag is a diff against the ORIGINAL port's API
          # table (937 symbols vs our 1372), so fetch it from Sor3nt directly —
          # this repo's own origin is the store repo, not upstream.
          git fetch --depth=1 https://github.com/Sor3nt/Flipper-Zero-ESP32-Port.git main
          git show FETCH_HEAD:components/flipper_application/flipper_application/firmware_api.c \
            > /tmp/stock_api.c

          for dir in $(jq -r '.apps[].dir' store/apps.json); do
            echo "::group::FAP $dir"
            ./buildFap.sh "applications_user/$dir"
            echo "::endgroup::"
          done

          python tools/make_catalog.py --stock-api /tmp/stock_api.c

      - name: Package artifacts
        run: |
          BOARD="${{ matrix.board.name }}"
          CHIP="${{ matrix.board.chip }}"
          FLASH_SIZE="${{ matrix.board.flash_size }}"
          BUILD="${{ matrix.board.build_dir }}"
          STAGE="artifact_staging"

          # Clean flat staging directory — what users actually unzip
          rm -rf "$STAGE"
          mkdir -p "$STAGE/bootloader" "$STAGE/partition_table"

          # Firmware binaries
          cp "$BUILD/furi_esp32.bin"                          "$STAGE/furi_esp32.bin"
          cp "$BUILD/bootloader/bootloader.bin"               "$STAGE/bootloader/bootloader.bin"
          cp "$BUILD/partition_table/partition-table.bin"     "$STAGE/partition_table/partition-table.bin"

          # ESP-IDF flash-args file (contains verified offsets and flash params)
          if [ -f "$BUILD/flash_project_args" ]; then
            cp "$BUILD/flash_project_args" "$STAGE/flash_args.txt"
          fi

          # Generate board-specific flash scripts by substituting template placeholders
          sed \
            -e "s/__BOARD_NAME__/${BOARD}/g" \
            -e "s/__CHIP__/${CHIP}/g"         \
            -e "s/__FLASH_SIZE__/${FLASH_SIZE}/g" \
            tools/flash_linux.sh > "$STAGE/flash_linux.sh"
          chmod +x "$STAGE/flash_linux.sh"

          sed \
            -e "s/__BOARD_NAME__/${BOARD}/g" \
            -e "s/__CHIP__/${CHIP}/g"         \
            -e "s/__FLASH_SIZE__/${FLASH_SIZE}/g" \
            tools/flash_windows.bat > "$STAGE/flash_windows.bat"

          echo ""
          echo "=== Staged artifact contents ==="
          ls -lh "$STAGE" "$STAGE/bootloader" "$STAGE/partition_table"

      # Must run AFTER "Package artifacts" — that step rm -rf's the staging dir.
      - name: Stage store into the artifact
        if: matrix.board.script_key == 't_embed'
        run: |
          mkdir -p artifact_staging/store/faps
          cp store/index.html store/style.css store/catalog.json store/catalog.txt artifact_staging/store/
          for id in $(jq -r '.apps[].id' store/apps.json); do
            cp "build_t_embed/fap/$id.fap" artifact_staging/store/faps/
          done
          ls -lh artifact_staging/store artifact_staging/store/faps

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.board.artifact_name }}
          # Upload from the flat staging dir so the zip has no extra path prefix.
          # Users unzip and immediately run flash_linux.sh or flash_windows.bat.
          path: artifact_staging/
          retention-days: 30

  # ── Publish the flasher + app store as one site ─────────────────────────────
  # Assembles the EXISTING pages (interface.html, store/index.html) against the
  # exact relative paths they already fetch, so neither page needs path edits.
  deploy-pages:
    name: Publish site
    needs: build
    # Default branch only — PRs still build, they just don't publish. Matched
    # against the repo's actual default branch so this works whether the store
    # repo calls it main or master (the push trigger above accepts both).
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: read      # declaring any permission zeroes the rest — checkout needs this
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Creates the Pages site on the first run, using the job's pages: write
      # token — so nobody has to find Settings -> Pages -> Source in the UI.
      # Without this, deploy-pages fails on a repo that has never had Pages on.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Download board artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Assemble site
        run: |
          set -eu
          SITE=_site
          T=artifacts/flipper-lilygo-t-embed-cc1101

          mkdir -p "$SITE/release/t-embed/latest"

          # The store page IS the site: it flashes firmware AND installs apps.
          # It lives at the root so catalog.json, faps/ and release/ are siblings.
          cp "$T/store/index.html"   "$SITE/index.html"
          cp "$T/store/style.css"   "$SITE/style.css"
          cp "$T/store/catalog.json" "$SITE/catalog.json"
          # Flat catalog the on-device WiFi store fetches (no JSON parser in firmware).
          cp "$T/store/catalog.txt"  "$SITE/catalog.txt"
          cp -r "$T/store/faps"      "$SITE/faps"
          cp favicon.ico             "$SITE/favicon.ico"

          # The original single-purpose flasher, kept reachable as a fallback
          # until the built-in flash path is confirmed on real hardware.
          cp interface.html "$SITE/flasher-legacy.html"

          # Flatten the bins to the paths interface.html's BOARDS table fetches.
          cp "$T/furi_esp32.bin"                      "$SITE/release/t-embed/latest/furi_esp32.bin"
          cp "$T/bootloader/bootloader.bin"           "$SITE/release/t-embed/latest/bootloader.bin"
          cp "$T/partition_table/partition-table.bin" "$SITE/release/t-embed/latest/partition-table.bin"

          echo "=== site ==="
          find "$SITE" -type f | sort
          du -sh "$SITE"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
